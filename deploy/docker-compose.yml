# Production-style stack for a single Azure VM:
#   caddy (TLS via Let's Encrypt, :80/:443) -> app (:4100, HTTP + MQTT-over-WebSocket) -> postgres
#
#   cp deploy/.env.example deploy/.env   # then edit
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# To use Azure Database for PostgreSQL instead, delete the `db` service and point
# DATABASE_URL at it (add ?sslmode=require).
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN}
      DATABASE_URL: ${DATABASE_URL:-postgres://notifier:${POSTGRES_PASSWORD}@db:5432/notifier}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      INGEST_TOKEN: ${INGEST_TOKEN}
      METRICS_TOKEN: ${METRICS_TOKEN}
    # Prometheus scrapes :4101/metrics (see docs/metrics.md). Caddy only proxies :4100, so
    # metrics are never public. Bind to the VM's private IP for a Prometheus elsewhere on
    # the network, or drop this and attach Prometheus to the compose network instead.
    ports:
      - "${METRICS_BIND:-127.0.0.1}:4101:4101"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notifier
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifier"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
